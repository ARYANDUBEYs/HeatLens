name: HeatLens Production CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Geospatial Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build & Verify Geospatial Frontend
        working-directory: frontend
        run: npm run build

      - name: Verification Summary
        run: |
          echo "✅ HeatLens Satellite Oracle Platform built and verified with zero errors!"
